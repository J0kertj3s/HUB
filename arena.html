<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Arena</title>
    <style>
      :root {
        --bg: #090d18;
        --panel: rgba(16, 22, 38, 0.9);
        --panel-2: rgba(22, 31, 54, 0.9);
        --line: rgba(255,255,255,0.08);
        --text: #edf5ff;
        --muted: #9fb3cf;
        --blue: #5ae2ff;
        --purple: #a86cff;
        --pink: #ff7ddc;
        --green: #72f1b8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1a2240, #090d18 55%);
        font-family: Inter, sans-serif;
        color: var(--text);
      }

      .arena-shell {
        width: min(860px, calc(100% - 30px));
        padding: 24px;
        border-radius: 24px;
        background: rgba(14, 19, 34, 0.82);
        border: 1px solid var(--line);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.25);
      }

      .arena-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      .hud {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .hud-box {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 12px;
        color: var(--muted);
      }

      .battle-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .fighter-card {
        background: linear-gradient(180deg, rgba(20, 27, 46, 0.95), rgba(15, 20, 35, 0.88));
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
      }

      .fighter-card h2 {
        margin: 0 0 14px;
        font-size: 1.4rem;
      }

      .fighter-avatar {
        display: grid;
        place-items: center;
        width: 110px;
        height: 110px;
        margin: 0 auto 16px;
        border-radius: 24px;
        font-size: 3rem;
        background: linear-gradient(135deg, rgba(90, 226, 255, 0.15), rgba(168, 108, 255, 0.22));
        border: 1px solid rgba(255,255,255,0.08);
      }

      .hp-label {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.82rem;
        margin-bottom: 8px;
      }

      .hp-bar {
        width: 100%;
        height: 16px;
        background: rgba(255,255,255,0.06);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .hp-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, var(--green), var(--blue));
        border-radius: inherit;
        transition: width 0.25s ease;
      }

      .enemy .hp-fill {
        background: linear-gradient(90deg, #ff7b7b, #ff7ddc);
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 12px;
        margin-top: 22px;
      }

      .action-btn {
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        padding: 12px 14px;
        background: rgba(255,255,255,0.03);
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
      }

      .action-btn.primary {
        background: linear-gradient(135deg, rgba(90, 226, 255, 0.18), rgba(168, 108, 255, 0.18));
      }

      .action-btn.danger {
        background: linear-gradient(135deg, rgba(255, 130, 130, 0.18), rgba(255, 125, 220, 0.18));
      }

      .action-btn.success {
        background: linear-gradient(135deg, rgba(72, 210, 160, 0.2), rgba(90, 226, 255, 0.2));
      }

      .status-panel {
        margin-top: 22px;
        padding: 18px;
        border-radius: 18px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
      }

      .status-panel h3 {
        margin: 0 0 10px;
        font-size: 1rem;
      }

      .log {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
        color: var(--muted);
      }

      .log li {
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(255,255,255,0.02);
      }

      .bottom-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 18px;
      }

      .restart-btn,
      .back-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 18px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.08);
        background: linear-gradient(135deg, #3a8dff, #7b5cff);
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
      }

      @media (max-width: 700px) {
        .battle-area {
          grid-template-columns: 1fr;
        }

        .arena-header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="arena-shell">
      <div class="arena-header">
        <h1>Pixel Arena</h1>
        <div class="hud">
          <div class="hud-box">Ronde: <strong id="roundCount">1</strong></div>
          <div class="hud-box">Jij: <strong id="playerEnergy">0</strong> energie</div>
        </div>
      </div>

      <div class="battle-area">
        <section class="fighter-card player">
          <h2>Jij</h2>
          <div class="fighter-avatar">🛡️</div>
          <div class="hp-label">
            <span>Levens</span>
            <span id="playerHpText">100 / 100</span>
          </div>
          <div class="hp-bar"><div id="playerHpBar" class="hp-fill"></div></div>
        </section>

        <section class="fighter-card enemy">
          <h2>Computer</h2>
          <div class="fighter-avatar">🤖</div>
          <div class="hp-label">
            <span>Levens</span>
            <span id="enemyHpText">100 / 100</span>
          </div>
          <div class="hp-bar"><div id="enemyHpBar" class="hp-fill"></div></div>
        </section>
      </div>

      <div class="actions">
        <button type="button" class="action-btn primary" data-action="attack">Aanval</button>
        <button type="button" class="action-btn danger" data-action="special">Special</button>
        <button type="button" class="action-btn success" data-action="heal">Genezen</button>
        <button type="button" class="action-btn" data-action="defend">Verdedigen</button>
      </div>

      <div class="status-panel">
        <h3>Gevechtslog</h3>
        <ul id="battleLog" class="log"></ul>
      </div>

      <div class="bottom-actions">
        <button type="button" class="restart-btn" id="restartArena">Opnieuw</button>
        <a href="index.html" class="back-link">Terug naar hub</a>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game-multiplayer.js"></script>
    <script src="arena.js"></script>
  </body>
</html>
