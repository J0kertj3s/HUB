<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trio</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090d18; color: #edf5ff; font-family: Inter, sans-serif; }
      .trio-page { width: min(680px, calc(100% - 28px)); padding: 28px; border: 1px solid rgba(255,255,255,.1); border-radius: 22px; background: #121a30; }
      .trio-grid { display: grid; grid-template-columns: repeat(4, minmax(58px, 1fr)); gap: 10px; margin: 20px 0; }
      .trio-card { min-height: 74px; border: 0; border-radius: 13px; color: #fff; font-size: 1.35rem; background: #263252; cursor: pointer; }
      .trio-card.open { background: linear-gradient(135deg, #5ae2ff, #7b5cff); }
      .trio-card:disabled { cursor: default; opacity: .76; }
      .trio-page a { color: #b8d2ff; }
    </style>
  </head>
  <body>
    <main class="trio-page">
      <h1>Trio</h1>
      <p id="trioStatus">Start een spel vanuit de lobby.</p>
      <div id="trioBoard" class="trio-grid"></div>
      <button id="trioRestart" class="primary-btn" type="button">Nieuw spel</button>
      <p><a href="index.html">Terug naar Game Hub</a></p>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="game-multiplayer.js"></script>
    <script src="trio.js"></script>
  </body>
</html>
